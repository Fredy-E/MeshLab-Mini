<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeshLab Mini</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p class="eyebrow">FREDY-E / CREATIVE TOOLS</p><h1>MeshLab Mini</h1><p class="subtitle">Explore geometry. See the mesh. Export what you build.</p></div><span class="icon">MM</span></header><section class="controls-grid"><label>Primitive<select id="shape"><option value="sphere">Sphere</option><option value="torus">Torus</option><option value="cylinder">Capped cylinder</option></select></label><label>Segments<input id="segments" type="range" min="8" max="96" value="40"><output id="segment-value">40</output></label><label>Rings<input id="rings" type="range" min="4" max="48" value="20"><output id="ring-value">20</output></label><label><input id="wire" type="checkbox">Wireframe</label><label><input id="normals" type="checkbox">Normal colors</label><button id="export">Export OBJ</button></section><p class="notice" id="message" role="status">Drag to rotate. Use the mouse wheel to zoom. Geometry is generated locally.</p><canvas id="canvas" style="height:500px" aria-label="Interactive procedural mesh"></canvas><p class="meta" id="counts"></p><footer>Raw WebGL2 · No downloaded models · No dependencies · Normal colors use object-space normals</footer></main><script src="geometry.js"></script><script src="renderer.js"></script><script>
const $=x=>document.getElementById(x);let mesh,renderer;let azimuth=.5,elevation=.4,distance=4;try{renderer=MeshRenderer.create($('canvas'))}catch(e){$('message').textContent=e.message;$('canvas').hidden=true}function draw(){renderer?.draw({azimuth,elevation,distance,wireframe:$('wire').checked,normalColor:$('normals').checked})}function update(){mesh=MeshGeometry.surface($('shape').value,Number($('segments').value),Number($('rings').value));$('segment-value').textContent=$('segments').value;$('ring-value').textContent=$('rings').value;$('counts').textContent=`${mesh.positions.length/3} vertices · ${mesh.indices.length/3} triangles · ${$('shape').value}`;renderer?.update(mesh);draw()}for(const id of ['shape','segments','rings'])$(id).addEventListener('input',update);for(const id of ['wire','normals'])$(id).addEventListener('change',draw);let drag=null;$('canvas').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('canvas').setPointerCapture(e.pointerId)};$('canvas').onpointermove=e=>{if(!drag)return;azimuth+=(e.clientX-drag[0])*.01;elevation=Math.max(-1.4,Math.min(1.4,elevation+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];draw()};$('canvas').onpointerup=$('canvas').onpointercancel=()=>drag=null;$('canvas').onwheel=e=>{e.preventDefault();distance=Math.max(2.4,Math.min(9,distance+e.deltaY*.004));draw()};window.addEventListener('resize',draw);$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([MeshGeometry.obj(mesh)],{type:'text/plain'}));a.download=$('shape').value+'.obj';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};update();
</script></body></html>
